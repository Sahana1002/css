<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Styled Portfolio</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>Sahanaa</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <!-- ABOUT -->
        <section id="about" class="card">
            <h2>About Me</h2>
            <img src="https://thumbs.dreamstime.com/b/professional-businesswoman-avatar-flat-vector-graphic-accomplished-female-symbolizes-user-profile-corporate-identity-396897272.jpg" alt="Profile Image">
            <p>
                I am a final-year AI & Data Science student passionate about machine learning and web development.
            </p>
        </section>

        <!-- SKILLS -->
        <section id="skills" class="card">
            <h2>Skills</h2>
            <ul>
                <li>Python</li>
                <li>Machine Learning</li>
                <li>HTML & CSS</li>
            </ul>
        </section>

        <!-- CONTACT -->
        <section id="contact" class="card">
            <h2>Contact Me</h2>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>Thank You</p>
    </footer>

</body>
</html>
